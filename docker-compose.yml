version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: lbs_user
      POSTGRES_PASSWORD: lbs_password
      POSTGRES_DB: lbs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lbs_user -d lbs_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build: .
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://lbs_user:lbs_password@db:5432/lbs_db
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
